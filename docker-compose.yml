services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: attest
      POSTGRES_USER: attest
      POSTGRES_PASSWORD: attest_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attest -d attest"]
      interval: 2s
      timeout: 5s
      retries: 10

  attest-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://attest:attest_dev@postgres:5432/attest
      DOWNSTREAM_BASE_URL: http://downstream-mock:8001
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn src.attest.app:app --host 0.0.0.0 --port 8000 --reload"

  downstream-mock:
    build:
      context: .
      dockerfile: Dockerfile.mock
    ports:
      - "8001:8001"
    environment:
      MOCK_PORT: "8001"
      DEFAULT_FAULT_PROFILE: none
      FAULT_RATE: "0.3"
    command: >
      uvicorn src.downstream_mock.app:app --host 0.0.0.0 --port 8001 --reload

volumes:
  pgdata:
