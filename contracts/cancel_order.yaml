name: cancel_order
resource_key: "{args.order_id}"
downstream:
  method: POST
  path: /orders/{args.order_id}/cancel
  idempotency_header: Idempotency-Key
  timeout_ms: 2000
  definite_failure_statuses: [400, 404, 409, 422]
postcondition:
  read: GET /orders/{args.order_id}
  assert:
    - "body.status == 'CANCELLED'"
compensation:
  method: POST
  path: /orders/{args.order_id}/reopen
reconcile:
  backoff_seconds: [1, 2, 4, 8, 16]
  deadline_seconds: 60
